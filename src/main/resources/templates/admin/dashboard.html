<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">User List</h2>

    <div class="text-end mb-3"> <!--link to the endpoint not html file-->
        <a class="btn btn-success" th:href="@{/add}">+ Add New User</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Name</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.title}"></td>
            <td th:text="${user.author}"></td>
            <td th:text="${user.category}"></td>
            <td>
                <a class="btn btn-primary btn-sm" th:href="@{/update/{userId}(userId=${user.id})}">Edit</a> <!--bookId must be same when trying to define the value-->
                <a class="btn btn-danger btn-sm" th:method="delete" th:href="@{/remove/{userId}(userId=${user.id})}"
                   onclick="return confirm('Are you sure you want to delete this user?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
