<!-- templates/user/update.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Update Password</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Update Password</h2>
<!--in order ot update new book. must mention the book id in html file too-->
<form th:action="@{/user/update/{userId}(userId=${user.id})}" th:object="${user}" th:method="post" class="mt-4">
  <div class="mb-3">
    <label for="password" class="form-label">New Password</label>
    <input type="text" th:field="*{password}" class="form-control" id="password" required>
  </div>

  <button type="submit" class="btn btn-primary">Save</button>
  <a th:href="@{/user}" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
