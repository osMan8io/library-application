<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Panel</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Book List</h2>

    <!-- NAVBAR WITH FORM -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">Book App</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>

                <form class="d-flex" role="search" method="get" action="/search">
                    <input class="form-control me-2" type="search" placeholder="Search" name="query">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>

            </div>
        </div>
    </nav>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Category</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.category}"></td>
            <td>
                <th:block th:if="${book.borrowedBy != null}">
                    <th:block th:if="${user != null and book.borrowedBy.id != null and book.borrowedBy.id == user.id}">
                        <a class="btn btn-primary" th:href="@{/user/return/{userId}/{bookId}(userId=${user.id}, bookId=${book.id})}">
                            Return
                        </a>
                    </th:block>
                </th:block>

                <th:block th:if="${book.borrowedBy == null}">
                    <a class="btn btn-success" th:href="@{/user/{userId}/borrow/{bookId}(userId=${user.id}, bookId=${book.id})}">
                        Borrow
                    </a>
                </th:block>

                <th:block th:if="${book.borrowedBy != null}">
                    <th:block th:if="${user != null and book.borrowedBy.id != null and book.borrowedBy.id != user.id}">
                        <button class="btn btn-secondary" onclick="alert('Sorry, this book is already borrowed by someone else.')">
                            Borrowed
                        </button>
                    </th:block>
                </th:block>

            </td>
        </tr>
        </tbody>
    </table>
</div>
<!-- Bootstrap 5.3 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
